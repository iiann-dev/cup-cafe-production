<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cup Cafe. | Every Sandwich Has A Story</title>
    
    <!-- DNS Prefetch & Preconnect for critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://cup-cafe.cafe-inspector.com" />
    <link rel="preconnect" href="https://i.pravatar.cc" crossorigin />
    
    <!-- Fonts with font-display: swap via preload -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400&family=Manrope:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400&family=Manrope:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400&family=Manrope:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@600&display=swap" /></noscript>
    
    <!-- Hero image preload with proper srcset for responsive -->
    <link rel="preload" as="image" href="/hero-lg.webp" imagesrcset="/hero-mobile.webp 600w, /hero-lg.webp 1200w, /hero.webp 1400w" imagesizes="(min-width: 1456px) 58vw, 100vw" fetchpriority="high" />
    
    <!-- Prefetch critical route chunks -->
    <link rel="prefetch" href="/src/pages/MenuPage.tsx" />
    <link rel="prefetch" href="/src/pages/OurStoryPage.tsx" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
